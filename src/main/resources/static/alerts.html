<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>库存预警 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1" v-html="navHtml"></nav>
  </aside>
  <main class="flex-1 p-8">
    <div class="flex justify-between mb-4">
      <h2 class="text-xl font-semibold">库存预警</h2>
      <el-button @click="scan">手动扫描</el-button>
    </div>
    <el-table :data="list" v-loading="loading" stripe border>
      <el-table-column prop="skuCode" label="SKU" width="140" />
      <el-table-column prop="warehouseId" label="仓库" width="80" />
      <el-table-column prop="alertType" label="类型" width="90" />
      <el-table-column prop="currentQty" label="当前量" width="80" />
      <el-table-column prop="threshold" label="阈值" width="80" />
      <el-table-column prop="status" label="状态" width="90" />
      <el-table-column label="操作" width="160">
        <template #default="{ row }">
          <el-button size="small" v-if="row.status==='OPEN'" @click="ack(row)">确认</el-button>
          <el-button size="small" @click="close(row)">关闭</el-button>
        </template>
      </el-table-column>
    </el-table>
  </main>
</div>
<style>.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}.nav-link.active{background:#2563eb;color:#fff}</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('alerts.html'));
    const list = ref([]), loading = ref(false);
    async function load() { loading.value = true; try { list.value = (await ImsAuth.api('/alerts?page=0&size=50')).items; } finally { loading.value = false; } }
    async function scan() { await ImsAuth.api('/alerts/scan', { method:'POST' }); load(); }
    async function ack(row) { await ImsAuth.api(`/alerts/${row.id}/ack`, { method:'POST' }); load(); }
    async function close(row) { await ImsAuth.api(`/alerts/${row.id}/close`, { method:'POST' }); load(); }
    onMounted(() => { if (ImsAuth.requireAuth()) load(); });
    return { navHtml, list, loading, load, scan, ack, close };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
