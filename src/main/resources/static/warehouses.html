<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库管理 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb' } } } } }</script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="index.html" class="nav-link">🏠 首页</a>
      <a href="categories.html" class="nav-link">🗂️ 商品分类</a>
      <a href="skus.html" class="nav-link">📦 商品 SKU</a>
      <a href="warehouses.html" class="nav-link active">🏭 仓库管理</a>
    </nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName }}</div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">仓库管理</h2>
        <p class="text-sm text-slate-500 mt-0.5">维护实体仓与虚拟仓，管理库位</p>
      </div>
      <div class="flex gap-2">
        <el-button v-if="canWrite" type="primary" @click="openCreate">新增仓库</el-button>
        <el-button @click="ImsAuth.logout()">退出</el-button>
      </div>
    </header>

    <div class="flex-1 p-8 space-y-4">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[180px]">
            <label class="block text-xs text-slate-500 mb-1">关键字</label>
            <el-input v-model="query.keyword" clearable @keyup.enter="loadList" />
          </div>
          <div class="w-36">
            <label class="block text-xs text-slate-500 mb-1">类型</label>
            <el-select v-model="query.type" placeholder="全部" clearable class="w-full">
              <el-option label="实体仓" value="PHYSICAL" /><el-option label="虚拟仓" value="VIRTUAL" />
            </el-select>
          </div>
          <div class="w-32">
            <label class="block text-xs text-slate-500 mb-1">状态</label>
            <el-select v-model="query.status" placeholder="全部" clearable class="w-full">
              <el-option label="启用" :value="1" /><el-option label="停用" :value="0" />
            </el-select>
          </div>
          <el-button type="primary" @click="loadList">查询</el-button>
          <el-button @click="resetQuery">重置</el-button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <el-table :data="list" v-loading="loading" stripe>
          <el-table-column prop="code" label="编码" min-width="110" />
          <el-table-column prop="name" label="名称" min-width="130" />
          <el-table-column label="类型" width="90" align="center">
            <template #default="{ row }">
              <el-tag :type="row.type === 'PHYSICAL' ? '' : 'warning'" size="small">{{ row.type === 'PHYSICAL' ? '实体仓' : '虚拟仓' }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="address" label="地址" min-width="160" show-overflow-tooltip>
            <template #default="{ row }">{{ row.address || '-' }}</template>
          </el-table-column>
          <el-table-column label="状态" width="80" align="center">
            <template #default="{ row }">
              <el-tag :type="row.status === 1 ? 'success' : 'info'" size="small">{{ row.status === 1 ? '启用' : '停用' }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="240" fixed="right">
            <template #default="{ row }">
              <el-button link type="primary" @click="openLocations(row)">库位</el-button>
              <el-button v-if="canWrite" link type="primary" @click="openEdit(row)">编辑</el-button>
              <el-button v-if="canWrite" link :type="row.status === 1 ? 'warning' : 'success'" @click="toggleStatus(row)">{{ row.status === 1 ? '停用' : '启用' }}</el-button>
            </template>
          </el-table-column>
        </el-table>
        <div class="px-4 py-3 border-t flex justify-end">
          <el-pagination v-model:current-page="page" v-model:page-size="size" :total="total" :page-sizes="[10,20,50]" layout="total,sizes,prev,pager,next" @change="loadList" />
        </div>
      </div>
    </div>

    <!-- Warehouse dialog -->
    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑仓库' : '新增仓库'" width="480px" destroy-on-close>
      <el-form ref="formRef" :model="form" :rules="rules" label-width="90px">
        <el-form-item label="仓库编码" prop="code"><el-input v-model="form.code" :disabled="isEdit" /></el-form-item>
        <el-form-item label="仓库名称" prop="name"><el-input v-model="form.name" /></el-form-item>
        <el-form-item label="仓库类型" prop="type">
          <el-radio-group v-model="form.type"><el-radio value="PHYSICAL">实体仓</el-radio><el-radio value="VIRTUAL">虚拟仓</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="地址"><el-input v-model="form.address" type="textarea" :rows="2" /></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" :loading="submitting" @click="submitForm">确定</el-button>
      </template>
    </el-dialog>

    <!-- Location drawer -->
    <el-drawer v-model="locDrawer" :title="'库位管理 - ' + (currentWh?.name || '')" size="640px">
      <div v-if="canWrite" class="mb-4 p-4 bg-slate-50 rounded-lg border">
        <h4 class="text-sm font-medium text-slate-700 mb-3">批量生成（区-排-层）</h4>
        <div class="flex flex-wrap gap-3 items-end">
          <div><label class="text-xs text-slate-500">区域</label><el-input v-model="batch.zone" placeholder="A" class="w-20" /></div>
          <div><label class="text-xs text-slate-500">排数</label><el-input-number v-model="batch.rows" :min="1" :max="99" /></div>
          <div><label class="text-xs text-slate-500">层数</label><el-input-number v-model="batch.layers" :min="1" :max="99" /></div>
          <el-button type="primary" :loading="batchLoading" @click="batchCreate">生成</el-button>
        </div>
        <p class="text-xs text-slate-400 mt-2">编码格式：A-01-01（区域-排-层），已存在则跳过</p>
      </div>
      <el-table :data="locations" v-loading="locLoading" stripe size="small">
        <el-table-column prop="code" label="库位编码" min-width="100" />
        <el-table-column prop="zone" label="区域" width="70" />
        <el-table-column prop="shelf" label="排" width="60" />
        <el-table-column label="默认" width="70" align="center">
          <template #default="{ row }"><el-tag v-if="row.isDefault===1" size="small" type="success">是</el-tag><span v-else>-</span></template>
        </el-table-column>
        <el-table-column label="状态" width="80" align="center">
          <template #default="{ row }">
            <el-tag :type="row.status===1?'success':'info'" size="small">{{ row.status===1?'启用':'停用' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column v-if="canWrite" label="操作" width="140">
          <template #default="{ row }">
            <el-button link type="primary" size="small" @click="setDefault(row)" v-if="row.isDefault!==1">设默认</el-button>
            <el-button link :type="row.status===1?'warning':'success'" size="small" @click="toggleLocStatus(row)">{{ row.status===1?'停用':'启用' }}</el-button>
          </template>
        </el-table-column>
      </el-table>
    </el-drawer>
  </main>
</div>
<style>
  .nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; }
  .nav-link:hover { background:#1e293b; color:#fff; }
  .nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
</style>
<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
  setup() {
    const user = ref(ImsAuth.getUser());
    const canWrite = computed(() => ImsAuth.hasPermission('system:warehouse'));
    const loading = ref(false); const submitting = ref(false);
    const list = ref([]); const total = ref(0); const page = ref(1); const size = ref(20);
    const query = reactive({ keyword: '', type: null, status: null });
    const dialogVisible = ref(false); const isEdit = ref(false); const editId = ref(null);
    const formRef = ref(null);
    const form = reactive({ code: '', name: '', type: 'PHYSICAL', address: '' });
    const rules = { code: [{ required: true, message: '请输入编码', trigger: 'blur' }], name: [{ required: true, message: '请输入名称', trigger: 'blur' }], type: [{ required: true, message: '请选择类型', trigger: 'change' }] };

    const locDrawer = ref(false); const locLoading = ref(false); const batchLoading = ref(false);
    const currentWh = ref(null); const locations = ref([]);
    const batch = reactive({ zone: 'A', rows: 3, layers: 5 });

    async function loadList() {
      loading.value = true;
      try {
        const p = new URLSearchParams({ page: page.value - 1, size: size.value });
        if (query.keyword) p.set('keyword', query.keyword);
        if (query.type) p.set('type', query.type);
        if (query.status != null) p.set('status', query.status);
        const data = await ImsAuth.api('/warehouses?' + p);
        list.value = data.items; total.value = data.total;
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
      finally { loading.value = false; }
    }

    function resetQuery() { query.keyword = ''; query.type = null; query.status = null; page.value = 1; loadList(); }
    function openCreate() { isEdit.value = false; editId.value = null; Object.assign(form, { code: '', name: '', type: 'PHYSICAL', address: '' }); dialogVisible.value = true; }
    function openEdit(row) { isEdit.value = true; editId.value = row.id; Object.assign(form, { code: row.code, name: row.name, type: row.type, address: row.address || '' }); dialogVisible.value = true; }

    async function submitForm() {
      await formRef.value.validate(); submitting.value = true;
      try {
        if (isEdit.value) {
          await ImsAuth.api('/warehouses/' + editId.value, { method: 'PUT', body: JSON.stringify({ name: form.name, type: form.type, address: form.address || null }) });
        } else {
          await ImsAuth.api('/warehouses', { method: 'POST', body: JSON.stringify(form) });
        }
        ElementPlus.ElMessage.success('保存成功'); dialogVisible.value = false; loadList();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
      finally { submitting.value = false; }
    }

    async function toggleStatus(row) {
      const ns = row.status === 1 ? 0 : 1;
      try {
        await ElementPlus.ElMessageBox.confirm(`确定${ns === 0 ? '停用' : '启用'}「${row.name}」？`);
        await ImsAuth.api('/warehouses/' + row.id + '/status', { method: 'PUT', body: JSON.stringify({ status: ns }) });
        ElementPlus.ElMessage.success('操作成功'); loadList();
      } catch (e) { if (e !== 'cancel') ElementPlus.ElMessage.error(e.message || e); }
    }

    async function openLocations(row) {
      currentWh.value = row; locDrawer.value = true; await loadLocations();
    }

    async function loadLocations() {
      if (!currentWh.value) return;
      locLoading.value = true;
      try { locations.value = await ImsAuth.api('/warehouses/' + currentWh.value.id + '/locations'); }
      catch (e) { ElementPlus.ElMessage.error(e.message); }
      finally { locLoading.value = false; }
    }

    async function batchCreate() {
      if (!batch.zone.trim()) return ElementPlus.ElMessage.warning('请输入区域前缀');
      batchLoading.value = true;
      try {
        const r = await ImsAuth.api('/warehouses/' + currentWh.value.id + '/locations/batch', {
          method: 'POST', body: JSON.stringify({ zone: batch.zone, rows: batch.rows, layers: batch.layers })
        });
        ElementPlus.ElMessage.success(`创建 ${r.created} 个，跳过 ${r.skipped} 个`);
        loadLocations();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
      finally { batchLoading.value = false; }
    }

    async function setDefault(row) {
      try {
        await ImsAuth.api('/locations/' + row.id, { method: 'PUT', body: JSON.stringify({ isDefault: 1 }) });
        ElementPlus.ElMessage.success('已设为默认库位'); loadLocations();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }

    async function toggleLocStatus(row) {
      const ns = row.status === 1 ? 0 : 1;
      try {
        await ImsAuth.api('/locations/' + row.id, { method: 'PUT', body: JSON.stringify({ status: ns }) });
        ElementPlus.ElMessage.success('操作成功'); loadLocations();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }

    onMounted(() => { if (!ImsAuth.requireAuth()) return; user.value = ImsAuth.getUser(); loadList(); });

    return {
      user, canWrite, loading, submitting, list, total, page, size, query, dialogVisible, isEdit, formRef, form, rules,
      locDrawer, locLoading, batchLoading, currentWh, locations, batch,
      loadList, resetQuery, openCreate, openEdit, submitForm, toggleStatus,
      openLocations, batchCreate, setDefault, toggleLocStatus, ImsAuth
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
