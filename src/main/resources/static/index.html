<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存管理系统 IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50 h-screen overflow-hidden">
<div id="app" class="flex h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700">
      <h1 class="text-lg font-bold">IMS 库存管理</h1>
      <p class="text-xs text-slate-400 mt-1">Inventory Management System</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml" @click="onNavClick"></nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName || '未登录' }}</div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0 bg-slate-100">
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0">
      <h2 class="text-base font-semibold text-slate-800">库存管理系统</h2>
      <el-button @click="ImsAuth.logout()">退出登录</el-button>
    </header>
    <div class="ims-tabs shrink-0" @wheel.prevent="onTabWheel">
      <div
        v-for="tab in tabs"
        :key="tab.id"
        class="ims-tab"
        :class="{ active: tab.id === activeId }"
        :title="tab.label"
        @click="activate(tab.id)"
      >
        <span class="ims-tab-icon">{{ tab.icon }}</span>
        <span class="ims-tab-label">{{ tab.label }}</span>
        <button class="ims-tab-close" type="button" title="关闭" @click.stop="closeTab(tab.id)">×</button>
      </div>
    </div>
    <div class="flex-1 relative min-h-0 bg-slate-50">
      <iframe
        v-for="tab in tabs"
        :key="tab.id"
        :src="tab.src"
        class="ims-frame"
        :class="tab.id === activeId ? 'is-active' : 'is-hidden'"
      ></iframe>
      <div v-if="!tabs.length" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">
        从左侧菜单打开页面
      </div>
    </div>
  </main>
</div>
<style>
  .nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; }
  .nav-link:hover { background:#1e293b; color:#fff; }
  .nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
  .ims-tabs {
    display:flex; align-items:stretch; gap:0; overflow-x:auto; overflow-y:hidden;
    background:#f1f5f9; border-bottom:1px solid #e2e8f0; min-height:38px;
  }
  .ims-tabs::-webkit-scrollbar { height:6px; }
  .ims-tabs::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
  .ims-tab {
    display:flex; align-items:center; gap:6px; padding:0 10px 0 12px; height:38px;
    font-size:13px; color:#475569; cursor:pointer; white-space:nowrap;
    border-right:1px solid #e2e8f0; background:#f8fafc; user-select:none;
  }
  .ims-tab:hover { background:#fff; color:#1e293b; }
  .ims-tab.active { background:#fff; color:#1e293b; font-weight:600; box-shadow:inset 0 -2px 0 #2563eb; }
  .ims-tab-icon { font-size:13px; line-height:1; }
  .ims-tab-label { max-width:140px; overflow:hidden; text-overflow:ellipsis; }
  .ims-tab-close {
    width:16px; height:16px; border:0; border-radius:4px; line-height:14px;
    background:transparent; color:#94a3b8; font-size:14px; cursor:pointer; padding:0;
  }
  .ims-tab-close:hover { background:#e2e8f0; color:#334155; }
  .ims-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#f8fafc; }
  .ims-frame.is-hidden { visibility:hidden; pointer-events:none; z-index:0; }
  .ims-frame.is-active { visibility:visible; z-index:1; }
</style>
<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue;
createApp({
  setup() {
    const user = ref(null);
    const tabs = ref([]);
    const activeId = ref('');
    const navHtml = computed(() => ImsNav.render(activeId.value));

    function persist() {
      try {
        sessionStorage.setItem(ImsNav.TABS_KEY, JSON.stringify({
          tabs: tabs.value.map(t => ({ id: t.id, src: t.src, label: t.label, icon: t.icon })),
          active: activeId.value
        }));
      } catch (e) { /* ignore */ }
      const current = tabs.value.find(t => t.id === activeId.value);
      const hash = current ? current.src : '';
      history.replaceState(null, '', hash ? ('#' + hash) : location.pathname);
      document.title = current ? (current.label + ' - IMS') : '库存管理系统 IMS';
    }

    function openTab(href) {
      const normalized = ImsNav.normalize(href);
      if (!normalized) return;
      const id = ImsNav.pageKey(normalized);
      const existing = tabs.value.find(t => t.id === id);
      if (existing) {
        activeId.value = id;
        persist();
        return;
      }
      const link = ImsNav.findLink(normalized);
      tabs.value.push({
        id,
        src: normalized,
        label: link ? link.label : id.replace(/\.html$/i, ''),
        icon: link ? link.icon : '📄'
      });
      activeId.value = id;
      persist();
    }

    function activate(id) {
      if (!tabs.value.some(t => t.id === id)) return;
      activeId.value = id;
      persist();
    }

    function closeTab(id) {
      const idx = tabs.value.findIndex(t => t.id === id);
      if (idx < 0) return;
      tabs.value.splice(idx, 1);
      if (activeId.value === id) {
        const next = tabs.value[idx] || tabs.value[idx - 1];
        activeId.value = next ? next.id : '';
      }
      persist();
    }

    function onNavClick(e) {
      const a = e.target.closest('a[data-ims-page]');
      if (!a) return;
      e.preventDefault();
      openTab(a.getAttribute('data-ims-page'));
    }

    function onTabWheel(e) {
      e.currentTarget.scrollLeft += e.deltaY;
    }

    function onMessage(e) {
      if (e.origin !== location.origin) return;
      const data = e.data;
      if (!data || data.type !== ImsNav.MSG_OPEN || typeof data.href !== 'string') return;
      openTab(data.href);
    }

    function restore() {
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(ImsNav.TABS_KEY) || 'null'); } catch (e) { saved = null; }
      const hadSession = saved && Array.isArray(saved.tabs);
      if (hadSession) {
        tabs.value = saved.tabs.filter(t => t && t.id && t.src);
        if (saved.active && tabs.value.some(t => t.id === saved.active)) {
          activeId.value = saved.active;
        } else if (tabs.value.length) {
          activeId.value = tabs.value[0].id;
        }
      }
      const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (hash) openTab(hash);
      else if (!hadSession) openTab('dashboard.html');
      else persist();
    }

    onMounted(() => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
      window.ImsShell = { openTab };
      window.addEventListener('message', onMessage);
      restore();
    });
    onUnmounted(() => {
      window.removeEventListener('message', onMessage);
      if (window.ImsShell) delete window.ImsShell;
    });

    return { user, tabs, activeId, navHtml, ImsAuth, onNavClick, onTabWheel, activate, closeTab };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
