<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存管理系统 IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700">
      <h1 class="text-lg font-bold">IMS 库存管理</h1>
      <p class="text-xs text-slate-400 mt-1">Inventory Management System</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName || '未登录' }}</div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-slate-800">首页概览</h2>
      <el-button @click="ImsAuth.logout()">退出登录</el-button>
    </header>
    <div class="flex-1 p-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="stat-card"><div class="stat-label">SKU 总数</div><div class="stat-value">{{ summary.skuCount ?? '-' }}</div></div>
        <div class="stat-card"><div class="stat-label">库存金额</div><div class="stat-value text-blue-600">{{ formatAmount(summary.inventoryAmount) }}</div></div>
        <div class="stat-card"><div class="stat-label">待审核单据</div><div class="stat-value text-amber-600">{{ summary.pendingApprovalCount ?? '-' }}</div></div>
        <div class="stat-card"><div class="stat-label">开放预警</div><div class="stat-value text-red-600">{{ summary.openAlertCount ?? '-' }}</div></div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white border rounded-xl p-4 lg:col-span-2">
          <h3 class="font-semibold mb-3">近 30 天出入库趋势</h3>
          <div ref="trendEl" style="height:280px"></div>
        </div>
        <div class="bg-white border rounded-xl p-4">
          <h3 class="font-semibold mb-3">库存金额 Top 10</h3>
          <el-table :data="topSkus" size="small" height="280">
            <el-table-column prop="skuCode" label="SKU" />
            <el-table-column prop="onHandQty" label="在库" width="70" />
            <el-table-column label="金额" width="90">
              <template #default="{ row }">{{ formatAmount(row.amount) }}</template>
            </el-table-column>
          </el-table>
        </div>
      </div>
    </div>
  </main>
</div>
<style>
  .nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; }
  .nav-link:hover { background:#1e293b; color:#fff; }
  .nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
  .stat-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; }
  .stat-label { font-size:.875rem; color:#64748b; }
  .stat-value { font-size:1.75rem; font-weight:700; color:#1e293b; margin-top:8px; }
</style>
<script>
const { createApp, ref, onMounted, computed } = Vue;
createApp({
  setup() {
    const user = ref(null);
    const summary = ref({});
    const topSkus = ref([]);
    const trendEl = ref(null);
    const navHtml = computed(() => ImsNav.render('index.html'));
    function formatAmount(v) {
      if (v == null) return '-';
      return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
      try {
        summary.value = await ImsAuth.api('/dashboard/summary');
        topSkus.value = await ImsAuth.api('/dashboard/top-skus');
        const trend = await ImsAuth.api('/dashboard/trend?days=30');
        const chart = echarts.init(trendEl.value);
        chart.setOption({
          tooltip: { trigger: 'axis' },
          legend: { data: ['入库', '出库'] },
          xAxis: { type: 'category', data: trend.map(t => t.date.slice(5)) },
          yAxis: { type: 'value' },
          series: [
            { name: '入库', type: 'line', data: trend.map(t => t.inboundQty), smooth: true },
            { name: '出库', type: 'line', data: trend.map(t => t.outboundQty), smooth: true }
          ]
        });
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      }
    });
    return { user, summary, topSkus, trendEl, navHtml, ImsAuth, formatAmount };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
