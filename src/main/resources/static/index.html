<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存管理系统 IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb' } } } } }
  </script>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700">
      <h1 class="text-lg font-bold">IMS 库存管理</h1>
      <p class="text-xs text-slate-400 mt-1">Inventory Management System</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="index.html" class="nav-link active">🏠 首页</a>
      <a href="categories.html" class="nav-link">🗂️ 商品分类</a>
      <a href="skus.html" class="nav-link">📦 商品 SKU</a>
      <a href="warehouses.html" class="nav-link">🏭 仓库管理</a>
    </nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName || '未登录' }}</div>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-slate-800">首页概览</h2>
      <el-button @click="ImsAuth.logout()">退出登录</el-button>
    </header>
    <div class="flex-1 p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl">
        <a href="categories.html" class="card">🗂️<h3>商品分类</h3><p>树形维护分类层级</p></a>
        <a href="skus.html" class="card">📦<h3>商品 SKU</h3><p>SKU 编码、规格、价格</p></a>
        <a href="warehouses.html" class="card">🏭<h3>仓库管理</h3><p>仓库与库位配置</p></a>
      </div>
    </div>
  </main>
</div>
<style>
  .nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; transition:.15s; }
  .nav-link:hover { background:#1e293b; color:#fff; }
  .nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
  .card { display:block; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:24px; box-shadow:0 1px 2px rgb(0 0 0/.05); transition:.2s; font-size:2rem; }
  .card h3 { font-size:1.125rem; font-weight:600; color:#1e293b; margin-top:12px; }
  .card p { font-size:.875rem; color:#64748b; margin-top:8px; }
  .card:hover { border-color:#2563eb; box-shadow:0 4px 12px rgb(0 0 0/.08); }
</style>
<script>
const { createApp, ref, onMounted } = Vue;
createApp({
  setup() {
    const user = ref(null);
    onMounted(() => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
    });
    return { user, ImsAuth };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
