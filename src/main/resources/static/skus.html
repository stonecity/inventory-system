<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品 SKU - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb' } } } } }
  </script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700">
      <h1 class="text-lg font-bold">IMS 库存管理</h1>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName }}</div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">商品 SKU 管理</h2>
        <p class="text-sm text-slate-500 mt-0.5">维护 SKU 编码、规格属性、价格与安全库存</p>
      </div>
      <div class="flex gap-2">
        <el-button v-if="canWrite" type="primary" @click="openCreate">新增 SKU</el-button>
        <el-button @click="ImsAuth.logout()">退出</el-button>
      </div>
    </header>

    <div class="flex-1 p-8 min-w-0 space-y-4">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[180px]">
            <label class="block text-xs text-slate-500 mb-1">关键字（编码/条码）</label>
            <el-input v-model="query.keyword" placeholder="扫码或搜索" clearable @keyup.enter="search" />
          </div>
          <div class="w-48">
            <label class="block text-xs text-slate-500 mb-1">所属 SPU</label>
            <el-select v-model="query.spuId" placeholder="全部" clearable filterable class="w-full">
              <el-option v-for="p in products" :key="p.id" :label="p.name" :value="p.id" />
            </el-select>
          </div>
          <div class="w-32">
            <label class="block text-xs text-slate-500 mb-1">状态</label>
            <el-select v-model="query.status" placeholder="全部" clearable class="w-full">
              <el-option label="启用" :value="1" />
              <el-option label="停用" :value="0" />
            </el-select>
          </div>
          <el-button type="primary" @click="search">查询</el-button>
          <el-button @click="resetQuery">重置</el-button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <el-table
          :data="list"
          v-loading="loading"
          stripe
          style="width: 100%"
          :height="tableHeight"
          :row-class-name="rowClass"
          empty-text="暂无 SKU 数据"
        >
          <el-table-column label="SKU" min-width="168" show-overflow-tooltip>
            <template #default="{ row }">
              <div class="font-medium text-slate-800 tracking-tight">{{ row.skuCode || '-' }}</div>
              <div class="text-xs text-slate-400 mt-0.5 font-mono">{{ row.barcode || '无条码' }}</div>
            </template>
          </el-table-column>
          <el-table-column prop="spuName" label="所属 SPU" min-width="140" show-overflow-tooltip>
            <template #default="{ row }">{{ row.spuName || '-' }}</template>
          </el-table-column>
          <el-table-column label="规格" min-width="180">
            <template #default="{ row }">
              <div v-if="specEntries(row.specJson).length" class="spec-cell">
                <el-tag
                  v-for="item in specEntries(row.specJson)"
                  :key="item.key"
                  size="small"
                  effect="plain"
                  type="info"
                >{{ item.key }} {{ item.value }}</el-tag>
              </div>
              <span v-else class="text-slate-400">-</span>
            </template>
          </el-table-column>
          <el-table-column label="成本价" width="110" align="right">
            <template #default="{ row }">
              <span class="tabular-nums text-slate-600">{{ formatPrice(row.costPrice) }}</span>
            </template>
          </el-table-column>
          <el-table-column label="售价" width="110" align="right">
            <template #default="{ row }">
              <span class="tabular-nums font-medium text-slate-800">{{ formatPrice(row.salePrice) }}</span>
            </template>
          </el-table-column>
          <el-table-column label="安全库存" width="96" align="right">
            <template #default="{ row }">
              <span class="tabular-nums">{{ row.defaultSafetyStock == null ? '-' : row.defaultSafetyStock }}</span>
            </template>
          </el-table-column>
          <el-table-column label="状态" width="88" align="center">
            <template #default="{ row }">
              <el-tag :type="row.status === 1 ? 'success' : 'info'" size="small">
                {{ row.status === 1 ? '启用' : '停用' }}
              </el-tag>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="148" fixed="right" align="center">
            <template #default="{ row }">
              <div class="op-cell">
                <el-button v-if="canWrite" link type="primary" @click="openEdit(row)">编辑</el-button>
                <el-button
                  v-if="canToggleStatus(row)"
                  link
                  :type="row.status === 1 ? 'warning' : 'success'"
                  @click="toggleStatus(row)"
                >{{ row.status === 1 ? '停用' : '启用' }}</el-button>
              </div>
            </template>
          </el-table-column>
        </el-table>
        <div class="px-4 py-3 border-t border-slate-100 flex justify-end">
          <el-pagination
            v-model:current-page="page"
            v-model:page-size="size"
            :total="total"
            :page-sizes="[10, 20, 50]"
            background
            layout="total, sizes, prev, pager, next"
            @current-change="loadList"
            @size-change="search"
          />
        </div>
      </div>
    </div>

    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑 SKU' : '新增 SKU'" width="560px" destroy-on-close>
      <el-form ref="formRef" :model="form" :rules="rules" label-width="100px">
        <el-form-item label="所属 SPU" prop="spuId">
          <div class="flex gap-2 w-full">
            <el-select v-model="form.spuId" placeholder="选择 SPU" filterable class="flex-1" :disabled="isEdit">
              <el-option v-for="p in products" :key="p.id" :label="p.name" :value="p.id" />
            </el-select>
            <el-button v-if="!isEdit && canWrite" @click="spuDialogVisible = true">新建 SPU</el-button>
          </div>
        </el-form-item>
        <el-form-item label="SKU 编码" prop="skuCode">
          <el-input v-model="form.skuCode" placeholder="业务编码 / 扫码主键" />
        </el-form-item>
        <el-form-item label="条码">
          <el-input v-model="form.barcode" placeholder="可选" />
        </el-form-item>
        <el-form-item label="规格属性">
          <div class="w-full space-y-2">
            <div v-for="(spec, idx) in specRows" :key="idx" class="flex gap-2">
              <el-input v-model="spec.key" placeholder="属性名，如颜色" class="flex-1" />
              <el-input v-model="spec.value" placeholder="属性值，如红" class="flex-1" />
              <el-button :icon="Delete" circle @click="specRows.splice(idx, 1)" />
            </div>
            <el-button size="small" @click="specRows.push({ key: '', value: '' })">+ 添加规格</el-button>
          </div>
        </el-form-item>
        <el-form-item label="成本价" prop="costPrice">
          <el-input-number v-model="form.costPrice" :min="0" :precision="2" :controls="false" style="width:100%" />
        </el-form-item>
        <el-form-item label="售价" prop="salePrice">
          <el-input-number v-model="form.salePrice" :min="0" :precision="2" :controls="false" style="width:100%" />
        </el-form-item>
        <el-form-item label="安全库存">
          <el-input-number v-model="form.defaultSafetyStock" :min="0" :controls="false" style="width:100%" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" :loading="submitting" @click="submitForm">确定</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="spuDialogVisible" title="快速新建 SPU" width="420px">
      <el-form :model="spuForm" label-width="80px">
        <el-form-item label="商品名" required>
          <el-input v-model="spuForm.name" />
        </el-form-item>
        <el-form-item label="品牌">
          <el-input v-model="spuForm.brand" />
        </el-form-item>
        <el-form-item label="单位">
          <el-input v-model="spuForm.unit" placeholder="件" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="spuDialogVisible = false">取消</el-button>
        <el-button type="primary" :loading="spuSubmitting" @click="createSpu">创建</el-button>
      </template>
    </el-dialog>
  </main>
</div>
<style>
.nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; }
.nav-link:hover { background:#1e293b; color:#fff; }
.nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
.el-table table { width:100% !important; border-collapse:separate !important; }
.el-table th.el-table__cell,
.el-table td.el-table__cell { display:table-cell !important; }
.el-table th.el-table__cell > .cell { white-space:nowrap; }
.el-table .row-disabled td { color:#94a3b8; background:#f8fafc !important; }
.el-pagination { flex-wrap:wrap; }
.op-cell { display:flex; flex-wrap:nowrap; justify-content:center; gap:0 4px; }
.op-cell .el-button { margin-left:0; }
.spec-cell { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.spec-cell .el-tag { margin:0; }
</style>
<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
  setup() {
    const { Delete } = ElementPlusIconsVue;
    const user = ref(ImsAuth.getUser());
    const navHtml = computed(() => ImsNav.render('skus.html'));
    const canWrite = computed(() => ImsAuth.hasPermission('sku:write'));
    const canDisable = computed(() => ImsAuth.hasPermission('sku:disable'));
    const tableHeight = computed(() => Math.max(360, window.innerHeight - 340));
    function canToggleStatus(row) {
      return row.status === 1 ? canDisable.value : canWrite.value;
    }
    const loading = ref(false);
    const submitting = ref(false);
    const list = ref([]);
    const total = ref(0);
    const page = ref(1);
    const size = ref(20);
    const products = ref([]);
    const query = reactive({ keyword: '', spuId: null, status: null });
    const dialogVisible = ref(false);
    const isEdit = ref(false);
    const editId = ref(null);
    const formRef = ref(null);
    const form = reactive({
      spuId: null, skuCode: '', barcode: '', costPrice: 0, salePrice: 0, defaultSafetyStock: 0, version: 0
    });
    const specRows = ref([]);
    const spuDialogVisible = ref(false);
    const spuSubmitting = ref(false);
    const spuForm = reactive({ name: '', brand: '', unit: '件' });

    const rules = {
      spuId: [{ required: true, message: '请选择 SPU', trigger: 'change' }],
      skuCode: [{ required: true, message: '请输入 SKU 编码', trigger: 'blur' }]
    };

    function parseSpec(spec) {
      if (!spec) return null;
      if (typeof spec === 'string') {
        try { spec = JSON.parse(spec); } catch { return null; }
      }
      if (typeof spec !== 'object' || Array.isArray(spec)) return null;
      return spec;
    }

    function specEntries(spec) {
      const obj = parseSpec(spec);
      if (!obj) return [];
      return Object.entries(obj)
        .filter(([k, v]) => k && v != null && String(v).length)
        .map(([key, value]) => ({ key, value }));
    }

    function formatPrice(value) {
      if (value == null || value === '') return '-';
      const n = Number(value);
      if (Number.isNaN(n)) return '-';
      return '¥' + n.toFixed(2);
    }

    function rowClass({ row }) {
      return row.status === 1 ? '' : 'row-disabled';
    }

    async function loadProducts() {
      const data = await ImsAuth.api('/products?page=0&size=200&status=1');
      products.value = data.items;
    }

    async function loadList() {
      loading.value = true;
      try {
        const params = new URLSearchParams({ page: page.value - 1, size: size.value });
        if (query.keyword) params.set('keyword', query.keyword);
        if (query.spuId) params.set('spuId', query.spuId);
        if (query.status != null) params.set('status', query.status);
        const data = await ImsAuth.api('/skus?' + params);
        list.value = data.items;
        total.value = data.total;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        loading.value = false;
      }
    }

    function search() {
      page.value = 1;
      loadList();
    }

    function resetQuery() {
      query.keyword = '';
      query.spuId = null;
      query.status = null;
      search();
    }

    function buildSpecJson() {
      const obj = {};
      specRows.value.forEach(r => {
        if (r.key && r.value) obj[r.key.trim()] = r.value.trim();
      });
      return Object.keys(obj).length ? obj : null;
    }

    function openCreate() {
      if (!products.value.length) {
        ElementPlus.ElMessageBox.confirm('暂无可用 SPU，是否快速创建一个？', '提示', { type: 'info' })
          .then(() => { spuDialogVisible.value = true; })
          .catch(() => {});
        return;
      }
      isEdit.value = false;
      editId.value = null;
      Object.assign(form, { spuId: null, skuCode: '', barcode: '', costPrice: 0, salePrice: 0, defaultSafetyStock: 0, version: 0 });
      specRows.value = [{ key: '颜色', value: '' }, { key: '尺码', value: '' }];
      dialogVisible.value = true;
    }

    function openEdit(row) {
      isEdit.value = true;
      editId.value = row.id;
      Object.assign(form, {
        spuId: row.spuId, skuCode: row.skuCode, barcode: row.barcode || '',
        costPrice: Number(row.costPrice), salePrice: Number(row.salePrice),
        defaultSafetyStock: row.defaultSafetyStock, version: row.version
      });
      const entries = specEntries(row.specJson);
      specRows.value = entries.length ? entries : [];
      dialogVisible.value = true;
    }

    async function submitForm() {
      await formRef.value.validate();
      submitting.value = true;
      try {
        const body = {
          skuCode: form.skuCode,
          barcode: form.barcode || null,
          specJson: buildSpecJson(),
          costPrice: form.costPrice,
          salePrice: form.salePrice,
          defaultSafetyStock: form.defaultSafetyStock
        };
        if (isEdit.value) {
          body.version = form.version;
          await ImsAuth.api('/skus/' + editId.value, { method: 'PUT', body: JSON.stringify(body) });
          ElementPlus.ElMessage.success('更新成功');
        } else {
          await ImsAuth.api('/products/' + form.spuId + '/skus', { method: 'POST', body: JSON.stringify(body) });
          ElementPlus.ElMessage.success('创建成功');
        }
        dialogVisible.value = false;
        loadList();
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        submitting.value = false;
      }
    }

    async function toggleStatus(row) {
      const newStatus = row.status === 1 ? 0 : 1;
      const action = newStatus === 0 ? '停用' : '启用';
      try {
        await ElementPlus.ElMessageBox.confirm(`确定${action} SKU「${row.skuCode}」？`, '确认');
        await ImsAuth.api('/skus/' + row.id + '/status', { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
        ElementPlus.ElMessage.success(action + '成功');
        loadList();
      } catch (e) {
        if (e !== 'cancel') ElementPlus.ElMessage.error(e.message || e);
      }
    }

    async function createSpu() {
      if (!spuForm.name.trim()) return ElementPlus.ElMessage.warning('请输入商品名');
      spuSubmitting.value = true;
      try {
        const p = await ImsAuth.api('/products', { method: 'POST', body: JSON.stringify(spuForm) });
        products.value.push(p);
        spuDialogVisible.value = false;
        spuForm.name = ''; spuForm.brand = '';
        ElementPlus.ElMessage.success('SPU 创建成功');
        if (!dialogVisible.value) openCreate();
        form.spuId = p.id;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        spuSubmitting.value = false;
      }
    }

    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
      await loadProducts();
      loadList();
    });

    return {
      Delete, user, navHtml, canWrite, canDisable, canToggleStatus, ImsAuth, tableHeight,
      loading, submitting, list, total, page, size, products, query,
      dialogVisible, isEdit, formRef, form, rules, specRows,
      spuDialogVisible, spuSubmitting, spuForm,
      specEntries, formatPrice, rowClass,
      loadList, search, resetQuery, openCreate, openEdit, submitForm, toggleStatus, createSpu
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
