<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>客户 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1" v-html="navHtml"></nav>
  </aside>
  <main class="flex-1 p-8">
    <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">客户</h2><el-button type="primary" @click="dlg=true">新增</el-button></div>
    <el-table :data="list" stripe border>
      <el-table-column prop="code" label="编码" width="120" /><el-table-column prop="name" label="名称" /><el-table-column prop="phone" label="电话" width="140" />
    </el-table>
    <el-dialog v-model="dlg" title="新增客户" width="480px">
      <el-form label-width="80px"><el-form-item label="编码"><el-input v-model="form.code" /></el-form-item><el-form-item label="名称"><el-input v-model="form.name" /></el-form-item><el-form-item label="电话"><el-input v-model="form.phone" /></el-form-item></el-form>
      <template #footer><el-button type="primary" @click="save">保存</el-button></template>
    </el-dialog>
  </main>
</div>
<style>.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}.nav-link.active{background:#2563eb;color:#fff}</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('customers.html'));
    const list = ref([]), dlg = ref(false), form = ref({ code:'', name:'', phone:'' });
    async function load() { list.value = (await ImsAuth.api('/customers?page=0&size=100')).items; }
    async function save() { await ImsAuth.api('/customers', { method:'POST', body: JSON.stringify(form.value) }); dlg.value=false; load(); }
    onMounted(() => { if (ImsAuth.requireAuth()) load(); });
    return { navHtml, list, dlg, form, save };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
