<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商品 SPU - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
  </aside>
  <main class="flex-1 p-8">
    <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">商品 SPU</h2><el-button type="primary" @click="open()">新增</el-button></div>
    <div class="mb-4 flex gap-3">
      <el-input v-model="keyword" placeholder="名称/品牌" style="width:200px" @keyup.enter="load" />
      <el-button type="primary" @click="load">查询</el-button>
    </div>
    <el-table :data="list" stripe border>
      <el-table-column prop="name" label="名称" />
      <el-table-column prop="brand" label="品牌" width="120" />
      <el-table-column prop="unit" label="单位" width="80" />
      <el-table-column label="状态" width="80"><template #default="{ row }">{{ row.status===1?'启用':'停用' }}</template></el-table-column>
      <el-table-column label="操作" width="200">
        <template #default="{ row }">
          <el-button size="small" @click="open(row)">编辑</el-button>
          <el-button size="small" @click="toggle(row)">{{ row.status===1?'停用':'启用' }}</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-dialog v-model="dlg" :title="form.id?'编辑 SPU':'新增 SPU'" width="480px">
      <el-form label-width="80px">
        <el-form-item label="名称"><el-input v-model="form.name" /></el-form-item>
        <el-form-item label="分类">
          <el-select v-model="form.categoryId" clearable filterable class="w-full">
            <el-option v-for="c in flatCats" :key="c.id" :label="c.name" :value="c.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="品牌"><el-input v-model="form.brand" /></el-form-item>
        <el-form-item label="单位"><el-input v-model="form.unit" /></el-form-item>
      </el-form>
      <template #footer><el-button type="primary" @click="save">保存</el-button></template>
    </el-dialog>
  </main>
</div>
<style>.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}.nav-link.active{background:#2563eb;color:#fff}</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('products.html'));
    const list = ref([]), keyword = ref(''), dlg = ref(false), form = ref({}), cats = ref([]);
    const flatCats = computed(() => {
      const out = [];
      function walk(nodes, prefix) {
        (nodes||[]).forEach(n => { out.push({ id:n.id, name: prefix + n.name }); walk(n.children, prefix + n.name + ' / '); });
      }
      walk(cats.value, '');
      return out;
    });
    async function load() {
      const q = new URLSearchParams({ page:0, size:50 });
      if (keyword.value) q.set('keyword', keyword.value);
      list.value = (await ImsAuth.api('/products?' + q)).items;
    }
    function open(row) { form.value = row ? { ...row } : { name:'', brand:'', unit:'件', categoryId:null }; dlg.value=true; }
    async function save() {
      if (form.value.id) await ImsAuth.api('/products/'+form.value.id, { method:'PUT', body: JSON.stringify(form.value) });
      else await ImsAuth.api('/products', { method:'POST', body: JSON.stringify(form.value) });
      dlg.value=false; load();
    }
    async function toggle(row) {
      await ImsAuth.api('/products/'+row.id+'/status', { method:'PUT', body: JSON.stringify({ status: row.status===1?0:1 }) });
      load();
    }
    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      cats.value = await ImsAuth.api('/categories');
      load();
    });
    return { navHtml, list, keyword, dlg, form, flatCats, load, open, save, toggle };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
