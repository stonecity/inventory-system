<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品 SPU - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb' } } } } }
  </script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName }}</div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">商品 SPU</h2>
        <p class="text-sm text-slate-500 mt-0.5">维护商品名称、分类、品牌与启停状态；库存挂在 SKU 上</p>
      </div>
      <div class="flex gap-2">
        <el-button v-if="canWrite" type="primary" @click="openCreate">新增 SPU</el-button>
        <el-button @click="ImsAuth.logout()">退出</el-button>
      </div>
    </header>

    <div class="flex-1 p-8 space-y-4">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[200px]">
            <label class="block text-xs text-slate-500 mb-1">关键字</label>
            <el-input v-model="query.keyword" placeholder="名称 / 品牌" clearable @keyup.enter="search" />
          </div>
          <div class="w-40">
            <label class="block text-xs text-slate-500 mb-1">状态</label>
            <el-select v-model="query.status" placeholder="全部" clearable class="w-full">
              <el-option label="启用" :value="1" />
              <el-option label="停用" :value="0" />
            </el-select>
          </div>
          <el-button type="primary" @click="search">查询</el-button>
          <el-button @click="resetQuery">重置</el-button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <el-table :data="list" v-loading="loading" stripe style="width: 100%" empty-text="暂无商品">
          <el-table-column prop="name" label="名称" min-width="180" show-overflow-tooltip />
          <el-table-column label="分类" min-width="160" show-overflow-tooltip>
            <template #default="{ row }">{{ categoryPath(row.categoryId) }}</template>
          </el-table-column>
          <el-table-column prop="brand" label="品牌" min-width="120">
            <template #default="{ row }">{{ row.brand || '-' }}</template>
          </el-table-column>
          <el-table-column prop="unit" label="单位" width="88" align="center">
            <template #default="{ row }">{{ row.unit || '-' }}</template>
          </el-table-column>
          <el-table-column label="状态" width="90" align="center">
            <template #default="{ row }">
              <el-tag :type="row.status === 1 ? 'success' : 'info'" size="small">
                {{ row.status === 1 ? '启用' : '停用' }}
              </el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="remark" label="备注" min-width="160" show-overflow-tooltip>
            <template #default="{ row }">{{ row.remark || '-' }}</template>
          </el-table-column>
          <el-table-column label="操作" width="220" fixed="right" align="center">
            <template #default="{ row }">
              <el-button v-if="canWrite" link type="primary" @click="openEdit(row)">编辑</el-button>
              <el-button v-if="canDisable" link :type="row.status === 1 ? 'warning' : 'success'" @click="toggleStatus(row)">
                {{ row.status === 1 ? '停用' : '启用' }}
              </el-button>
              <el-button link type="primary" @click="goSkus(row)">SKU</el-button>
            </template>
          </el-table-column>
        </el-table>
        <div class="px-4 py-3 border-t border-slate-100 flex justify-end">
          <el-pagination
            v-model:current-page="page"
            v-model:page-size="size"
            :total="total"
            :page-sizes="[10, 20, 50]"
            layout="total, sizes, prev, pager, next"
            @change="loadList"
          />
        </div>
      </div>
    </div>

    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑 SPU' : '新增 SPU'" width="520px" destroy-on-close>
      <el-form ref="formRef" :model="form" :rules="rules" label-width="88px">
        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" maxlength="100" show-word-limit placeholder="如：纯棉T恤" />
        </el-form-item>
        <el-form-item label="分类">
          <el-select v-model="form.categoryId" placeholder="可选" clearable filterable class="w-full">
            <el-option v-for="c in flatCats" :key="c.id" :label="c.name" :value="c.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="品牌">
          <el-input v-model="form.brand" maxlength="50" placeholder="可选" />
        </el-form-item>
        <el-form-item label="单位" prop="unit">
          <el-input v-model="form.unit" maxlength="10" placeholder="件" />
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark" type="textarea" :rows="2" maxlength="255" show-word-limit placeholder="可选" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" :loading="submitting" @click="submitForm">确定</el-button>
      </template>
    </el-dialog>
  </main>
</div>
<style>
  .nav-link { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; font-size:14px; color:#cbd5e1; }
  .nav-link:hover { background:#1e293b; color:#fff; }
  .nav-link.active { background:#2563eb; color:#fff; font-weight:500; }
  .el-table table { width:100% !important; border-collapse:separate !important; }
  .el-table th.el-table__cell, .el-table td.el-table__cell { display:table-cell !important; }
  .el-pagination { flex-wrap:wrap; }
</style>
<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
  setup() {
    const user = ref(ImsAuth.getUser());
    const navHtml = computed(() => ImsNav.render('products.html'));
    const canWrite = computed(() => ImsAuth.hasPermission('sku:write'));
    const canDisable = computed(() => ImsAuth.hasPermission('sku:disable'));
    const loading = ref(false);
    const submitting = ref(false);
    const list = ref([]);
    const total = ref(0);
    const page = ref(1);
    const size = ref(20);
    const cats = ref([]);
    const query = reactive({ keyword: '', status: null });
    const dialogVisible = ref(false);
    const isEdit = ref(false);
    const editId = ref(null);
    const formRef = ref(null);
    const form = reactive({ name: '', categoryId: null, brand: '', unit: '件', remark: '' });
    const rules = {
      name: [{ required: true, message: '请输入商品名称', trigger: 'blur' }],
      unit: [{ required: true, message: '请输入单位', trigger: 'blur' }]
    };

    const flatCats = computed(() => {
      const out = [];
      function walk(nodes, prefix) {
        (nodes || []).forEach(n => {
          out.push({ id: n.id, name: prefix + n.name });
          walk(n.children, prefix + n.name + ' / ');
        });
      }
      walk(cats.value, '');
      return out;
    });

    const catPathMap = computed(() => {
      const map = {};
      flatCats.value.forEach(c => { map[c.id] = c.name; });
      return map;
    });

    function categoryPath(id) {
      if (!id) return '-';
      return catPathMap.value[id] || '-';
    }

    async function loadList() {
      loading.value = true;
      try {
        const params = new URLSearchParams({ page: page.value - 1, size: size.value });
        if (query.keyword) params.set('keyword', query.keyword);
        if (query.status != null) params.set('status', query.status);
        const data = await ImsAuth.api('/products?' + params);
        list.value = data.items || [];
        total.value = data.total || 0;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        loading.value = false;
      }
    }

    function search() {
      page.value = 1;
      loadList();
    }

    function resetQuery() {
      query.keyword = '';
      query.status = null;
      page.value = 1;
      loadList();
    }

    function resetForm() {
      form.name = '';
      form.categoryId = null;
      form.brand = '';
      form.unit = '件';
      form.remark = '';
    }

    function openCreate() {
      isEdit.value = false;
      editId.value = null;
      resetForm();
      dialogVisible.value = true;
    }

    function openEdit(row) {
      isEdit.value = true;
      editId.value = row.id;
      form.name = row.name || '';
      form.categoryId = row.categoryId || null;
      form.brand = row.brand || '';
      form.unit = row.unit || '件';
      form.remark = row.remark || '';
      dialogVisible.value = true;
    }

    async function submitForm() {
      await formRef.value.validate();
      submitting.value = true;
      try {
        const body = {
          name: form.name.trim(),
          categoryId: form.categoryId || null,
          brand: form.brand ? form.brand.trim() : null,
          unit: form.unit.trim(),
          remark: form.remark ? form.remark.trim() : null
        };
        if (isEdit.value) {
          await ImsAuth.api('/products/' + editId.value, { method: 'PUT', body: JSON.stringify(body) });
          ElementPlus.ElMessage.success('更新成功');
        } else {
          await ImsAuth.api('/products', { method: 'POST', body: JSON.stringify(body) });
          ElementPlus.ElMessage.success('创建成功');
        }
        dialogVisible.value = false;
        loadList();
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        submitting.value = false;
      }
    }

    async function toggleStatus(row) {
      const newStatus = row.status === 1 ? 0 : 1;
      const action = newStatus === 0 ? '停用' : '启用';
      try {
        await ElementPlus.ElMessageBox.confirm(`确定${action} SPU「${row.name}」？`, '确认');
        await ImsAuth.api('/products/' + row.id + '/status', {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus })
        });
        ElementPlus.ElMessage.success(action + '成功');
        loadList();
      } catch (e) {
        if (e !== 'cancel') ElementPlus.ElMessage.error(e.message || e);
      }
    }

    function goSkus(row) {
      ImsNav.openPage('skus.html?spuId=' + row.id);
    }

    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
      try {
        cats.value = await ImsAuth.api('/categories') || [];
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      }
      loadList();
    });

    return {
      user, navHtml, canWrite, canDisable, ImsAuth,
      loading, submitting, list, total, page, size, query, flatCats,
      dialogVisible, isEdit, formRef, form, rules,
      categoryPath, loadList, search, resetQuery, openCreate, openEdit, submitForm, toggleStatus, goSkus
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
