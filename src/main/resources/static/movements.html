<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>出入库单据 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
  </aside>
  <main class="flex-1 p-8">
    <div class="flex justify-between mb-4">
      <h2 class="text-xl font-semibold">出入库单据</h2>
      <el-dropdown @command="openCreate">
        <el-button type="primary">新建单据</el-button>
        <template #dropdown>
          <el-dropdown-menu>
            <el-dropdown-item command="PURCHASE_IN">采购入库</el-dropdown-item>
            <el-dropdown-item command="SALE_OUT">销售出库</el-dropdown-item>
            <el-dropdown-item command="TRANSFER">调拨</el-dropdown-item>
          </el-dropdown-menu>
        </template>
      </el-dropdown>
    </div>
    <div class="bg-white rounded-xl border p-4 mb-4 flex gap-3">
      <el-select v-model="query.type" placeholder="类型" clearable style="width:140px">
        <el-option label="采购入库" value="PURCHASE_IN" /><el-option label="销售出库" value="SALE_OUT" /><el-option label="调拨" value="TRANSFER" />
      </el-select>
      <el-select v-model="query.status" placeholder="状态" clearable style="width:140px">
        <el-option label="草稿" value="DRAFT" /><el-option label="待审核" value="PENDING_APPROVAL" /><el-option label="已预留" value="RESERVED" /><el-option label="已完成" value="COMPLETED" /><el-option label="已出库" value="SHIPPED" />
      </el-select>
      <el-button type="primary" @click="load">查询</el-button>
    </div>
    <el-table :data="list" v-loading="loading" stripe border>
      <el-table-column prop="movementNo" label="单号" width="180" />
      <el-table-column prop="type" label="类型" width="110" />
      <el-table-column prop="status" label="状态" width="130" />
      <el-table-column prop="totalQty" label="数量" width="80" />
      <el-table-column prop="warehouseId" label="仓库" width="80" />
      <el-table-column label="操作" min-width="280">
        <template #default="{ row }">
          <el-button size="small" @click="showDetail(row)">详情</el-button>
          <el-button size="small" v-if="row.status==='DRAFT'" @click="doSubmit(row)">提交</el-button>
          <el-button size="small" v-if="['PENDING_APPROVAL','RESERVED'].includes(row.status)" @click="doApprove(row)">审核</el-button>
          <el-button size="small" v-if="row.status==='APPROVED' && row.type==='PURCHASE_IN'" @click="doReceive(row)">验货入库</el-button>
          <el-button size="small" v-if="row.status==='APPROVED' && row.type==='SALE_OUT'" @click="doPick(row)">拣货</el-button>
          <el-button size="small" v-if="row.status==='PICKING'" @click="doShip(row)">确认出库</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-dialog v-model="dlgVisible" title="新建单据" width="640px">
      <el-form label-width="100px">
        <el-form-item label="源仓库"><el-select v-model="form.warehouseId" filterable class="w-full"><el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" /></el-select></el-form-item>
        <el-form-item v-if="createType==='TRANSFER'" label="目标仓库"><el-select v-model="form.toWarehouseId" filterable class="w-full"><el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" /></el-select></el-form-item>
        <el-form-item v-if="createType==='PURCHASE_IN'" label="供应商"><el-select v-model="form.partnerId" filterable class="w-full"><el-option v-for="s in suppliers" :key="s.id" :label="s.name" :value="s.id" /></el-select></el-form-item>
        <el-form-item v-if="createType==='SALE_OUT'" label="客户"><el-select v-model="form.partnerId" filterable class="w-full"><el-option v-for="c in customers" :key="c.id" :label="c.name" :value="c.id" /></el-select></el-form-item>
        <el-form-item label="SKU"><el-select v-model="form.skuId" filterable class="w-full"><el-option v-for="s in skus" :key="s.id" :label="s.skuCode" :value="s.id" /></el-select></el-form-item>
        <el-form-item label="数量"><el-input-number v-model="form.qty" :min="1" /></el-form-item>
      </el-form>
      <template #footer><el-button @click="dlgVisible=false">取消</el-button><el-button type="primary" @click="saveCreate">保存</el-button></template>
    </el-dialog>
  </main>
</div>
<style>.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}.nav-link.active{background:#2563eb;color:#fff}</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
const EP = { PURCHASE_IN:'/movements/purchase-in', SALE_OUT:'/movements/sale-out', TRANSFER:'/movements/transfer' };
createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('movements.html'));
    const list = ref([]), loading = ref(false), query = ref({}), warehouses = ref([]), skus = ref([]), suppliers = ref([]), customers = ref([]);
    const dlgVisible = ref(false), createType = ref('PURCHASE_IN'), form = ref({ warehouseId:null, toWarehouseId:null, partnerId:null, skuId:null, qty:1 });
    async function load() {
      loading.value = true;
      try {
        const q = new URLSearchParams({ page:0, size:50 });
        if (query.value.type) q.set('type', query.value.type);
        if (query.value.status) q.set('status', query.value.status);
        list.value = (await ImsAuth.api('/movements?' + q)).items;
      } finally { loading.value = false; }
    }
    function openCreate(type) { createType.value = type; dlgVisible.value = true; }
    async function saveCreate() {
      const body = { warehouseId: form.value.warehouseId, toWarehouseId: form.value.toWarehouseId, partnerId: form.value.partnerId,
        items: [{ skuId: form.value.skuId, plannedQty: form.value.qty }] };
      await ImsAuth.api(EP[createType.value], { method:'POST', body: JSON.stringify(body) });
      dlgVisible.value = false; load();
      ElementPlus.ElMessage.success('创建成功');
    }
    async function doSubmit(row) { await ImsAuth.api(`/movements/${row.id}/submit`, { method:'POST', body: JSON.stringify({ version: row.version }) }); load(); }
    async function doApprove(row) { await ImsAuth.api(`/movements/${row.id}/approve`, { method:'POST', body: JSON.stringify({ version: row.version }) }); load(); }
    async function doPick(row) { await ImsAuth.api(`/movements/${row.id}/pick`, { method:'POST', body: JSON.stringify({ version: row.version }) }); load(); }
    async function doReceive(row) {
      const detail = await ImsAuth.api(`/movements/${row.id}`);
      const items = detail.items.map(i => ({ itemId: i.id, actualQty: i.plannedQty }));
      await ImsAuth.api(`/movements/${row.id}/receive`, { method:'POST', body: JSON.stringify({ version: detail.version, items }) });
      load();
    }
    async function doShip(row) {
      const detail = await ImsAuth.api(`/movements/${row.id}`);
      const items = detail.items.map(i => ({ itemId: i.id, actualQty: i.plannedQty }));
      await ImsAuth.api(`/movements/${row.id}/ship`, { method:'POST', body: JSON.stringify({ version: detail.version, items }) });
      load();
    }
    function showDetail(row) { ElementPlus.ElMessage.info('单号: ' + row.movementNo + ' 状态: ' + row.status); }
    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      warehouses.value = (await ImsAuth.api('/warehouses?page=0&size=100')).items;
      skus.value = (await ImsAuth.api('/skus?page=0&size=200')).items;
      suppliers.value = (await ImsAuth.api('/suppliers?page=0&size=100')).items;
      customers.value = (await ImsAuth.api('/customers?page=0&size=100')).items;
      load();
    });
    return { navHtml, list, loading, query, load, dlgVisible, createType, form, warehouses, skus, suppliers, customers, openCreate, saveCreate, doSubmit, doApprove, doReceive, doPick, doShip, showDetail };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
