<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盘点管理 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">盘点任务</h2>
        <p class="text-sm text-slate-500 mt-0.5">创建盘点、锁定快照、录入实盘并审批盘盈盘亏</p>
      </div>
      <el-button type="primary" @click="createDlg=true">创建盘点</el-button>
    </header>

    <div class="flex-1 p-8 min-w-0">
      <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 shadow-sm">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="w-48">
            <label class="block text-xs text-slate-500 mb-1">仓库</label>
            <el-select v-model="query.warehouseId" placeholder="全部仓库" clearable filterable class="w-full">
              <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
            </el-select>
          </div>
          <div class="w-44">
            <label class="block text-xs text-slate-500 mb-1">状态</label>
            <el-select v-model="query.status" placeholder="全部状态" clearable class="w-full">
              <el-option v-for="s in statuses" :key="s.v" :label="s.l" :value="s.v" />
            </el-select>
          </div>
          <el-button type="primary" @click="search">查询</el-button>
          <el-button @click="resetQuery">重置</el-button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <el-table
          :data="list"
          v-loading="loading"
          stripe
          style="width: 100%"
          :height="tableHeight"
          empty-text="暂无盘点任务"
        >
          <el-table-column prop="stocktakeNo" label="盘点单号" min-width="170" show-overflow-tooltip>
            <template #default="{ row }">
              <div class="font-medium text-slate-800">{{ row.stocktakeNo || '-' }}</div>
            </template>
          </el-table-column>
          <el-table-column label="仓库" min-width="140" show-overflow-tooltip>
            <template #default="{ row }">{{ warehouseName(row.warehouseId) }}</template>
          </el-table-column>
          <el-table-column label="范围" width="110" align="center">
            <template #default="{ row }">{{ scopeLabel(row.scope) }}</template>
          </el-table-column>
          <el-table-column label="状态" width="118" align="center">
            <template #default="{ row }">
              <el-tag :type="statusTag(row.status)" size="small">{{ statusLabel(row.status) }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="gainQty" label="盘盈" width="80" align="right">
            <template #default="{ row }">
              <span :class="row.gainQty > 0 ? 'text-green-600 font-medium' : 'text-slate-500'">{{ row.gainQty ?? 0 }}</span>
            </template>
          </el-table-column>
          <el-table-column prop="lossQty" label="盘亏" width="80" align="right">
            <template #default="{ row }">
              <span :class="row.lossQty > 0 ? 'text-red-600 font-medium' : 'text-slate-500'">{{ row.lossQty ?? 0 }}</span>
            </template>
          </el-table-column>
          <el-table-column label="创建时间" width="170">
            <template #default="{ row }">{{ formatTime(row.createdAt) }}</template>
          </el-table-column>
          <el-table-column label="操作" min-width="260" fixed="right" align="right">
            <template #default="{ row }">
              <div class="op-cell">
                <el-button link type="primary" v-if="row.status==='CREATED'" @click="doLock(row)">冻结快照</el-button>
                <el-button link type="primary" v-if="['LOCKED','COUNTING'].includes(row.status)" @click="openCount(row)">录入实盘</el-button>
                <el-button link type="primary" v-if="row.status==='COUNTING'" @click="doSubmit(row)">提交差异</el-button>
                <el-button link type="success" v-if="row.status==='PENDING_APPROVAL'" @click="doApprove(row)">审批生效</el-button>
                <el-button link type="warning" v-if="row.status==='PENDING_APPROVAL'" @click="doReject(row)">驳回</el-button>
                <el-button link type="danger" v-if="!['COMPLETED','CANCELLED'].includes(row.status)" @click="doCancel(row)">取消</el-button>
                <el-button link type="primary" @click="downloadReport(row)">报表</el-button>
              </div>
            </template>
          </el-table-column>
        </el-table>
        <div class="px-4 py-3 border-t border-slate-100 flex justify-end">
          <el-pagination
            v-model:current-page="page"
            v-model:page-size="size"
            :total="total"
            :page-sizes="[10, 20, 50, 100]"
            background
            layout="total, sizes, prev, pager, next, jumper"
            @current-change="load"
            @size-change="search"
          />
        </div>
      </div>
    </div>

    <el-dialog v-model="createDlg" title="创建盘点" width="480px">
      <el-form label-width="90px">
        <el-form-item label="仓库">
          <el-select v-model="form.warehouseId" filterable class="w-full">
            <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="范围">
          <el-select v-model="form.scope" class="w-full">
            <el-option label="全仓" value="ALL" />
            <el-option label="按分类" value="BY_CATEGORY" />
            <el-option label="按库位" value="BY_LOCATION" />
            <el-option label="按 SKU" value="BY_SKU" />
          </el-select>
        </el-form-item>
        <el-form-item v-if="form.scope!=='ALL'" label="范围值">
          <el-input v-model="form.scopeText" placeholder="ID 逗号分隔" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="createDlg=false">取消</el-button>
        <el-button type="primary" @click="doCreate">创建</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="countDlg" title="录入实盘" width="860px" class="count-dlg">
      <div class="mb-3 flex items-center gap-3">
        <input type="file" accept=".csv" @change="importCsv" />
        <span class="text-xs text-slate-500">CSV: skuCode,locationId,countedQty,reason</span>
      </div>
      <el-table :data="pagedCountItems" border size="small" height="360" style="width: 100%" empty-text="暂无盘点明细">
        <el-table-column prop="skuCode" label="SKU" min-width="140" show-overflow-tooltip />
        <el-table-column prop="locationId" label="库位" width="90" align="center">
          <template #default="{ row }">{{ row.locationId || '-' }}</template>
        </el-table-column>
        <el-table-column prop="snapshotQty" label="快照" width="80" align="right" />
        <el-table-column label="实盘" width="150" align="center">
          <template #default="{ row }">
            <el-input-number v-model="row.countedQty" :min="0" size="small" :disabled="row.excluded===1" />
          </template>
        </el-table-column>
        <el-table-column label="差异" width="80" align="right">
          <template #default="{ row }">
            <span :class="diffClass(row)">{{ diffQty(row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="80" align="center">
          <template #default="{ row }">
            <el-tag v-if="row.excluded===1" type="info" size="small">已排除</el-tag>
            <span v-else class="text-slate-400">-</span>
          </template>
        </el-table-column>
      </el-table>
      <div class="mt-3 flex justify-end">
        <el-pagination
          v-model:current-page="countPage"
          v-model:page-size="countSize"
          :total="countItems.length"
          :page-sizes="[10, 20, 50]"
          background
          layout="total, sizes, prev, pager, next"
          small
        />
      </div>
      <template #footer>
        <el-button @click="countDlg=false">取消</el-button>
        <el-button type="primary" @click="saveCounts">保存</el-button>
      </template>
    </el-dialog>
  </main>
</div>
<style>
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}
.nav-link.active{background:#2563eb;color:#fff}
.el-table table{width:100% !important;border-collapse:separate !important}
.el-table th.el-table__cell,.el-table td.el-table__cell{display:table-cell !important}
.el-pagination{flex-wrap:wrap}
.op-cell{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 4px}
.op-cell .el-button{margin-left:0}
</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
const STATUS_MAP = {
  CREATED: { l: '已创建', tag: 'info' },
  LOCKED: { l: '已锁定', tag: 'warning' },
  COUNTING: { l: '盘点中', tag: '' },
  PENDING_APPROVAL: { l: '待审批', tag: 'warning' },
  COMPLETED: { l: '已完成', tag: 'success' },
  CANCELLED: { l: '已取消', tag: 'info' }
};
const SCOPE_MAP = {
  ALL: '全仓',
  BY_CATEGORY: '按分类',
  BY_LOCATION: '按库位',
  BY_SKU: '按 SKU'
};
createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('stocktake.html'));
    const tableHeight = computed(() => Math.max(360, window.innerHeight - 340));
    const list = ref([]), loading = ref(false), warehouses = ref([]);
    const total = ref(0), page = ref(1), size = ref(20);
    const query = ref({ warehouseId: null, status: null });
    const createDlg = ref(false), form = ref({ warehouseId: null, scope: 'ALL', scopeText: '' });
    const countDlg = ref(false), countItems = ref([]), currentStId = ref(null);
    const countPage = ref(1), countSize = ref(10);
    const statuses = Object.keys(STATUS_MAP).map(v => ({ v, l: STATUS_MAP[v].l }));
    const pagedCountItems = computed(() => {
      const start = (countPage.value - 1) * countSize.value;
      return countItems.value.slice(start, start + countSize.value);
    });
    function statusLabel(v) { return (STATUS_MAP[v] && STATUS_MAP[v].l) || v || '-'; }
    function statusTag(v) { return (STATUS_MAP[v] && STATUS_MAP[v].tag) || 'info'; }
    function scopeLabel(v) { return SCOPE_MAP[v] || v || '-'; }
    function warehouseName(id) {
      if (!id) return '-';
      const w = warehouses.value.find(x => x.id === id);
      return w ? w.name : String(id);
    }
    function formatTime(v) {
      if (v == null || v === '') return '-';
      const d = typeof v === 'number' ? new Date(v > 1e12 ? v : v * 1000) : new Date(v);
      if (Number.isNaN(d.getTime())) return String(v);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    function diffQty(row) {
      return (row.countedQty ?? row.snapshotQty) - row.snapshotQty;
    }
    function diffClass(row) {
      const d = diffQty(row);
      if (d > 0) return 'text-green-600 font-medium';
      if (d < 0) return 'text-red-600 font-medium';
      return 'text-slate-500';
    }
    async function load() {
      loading.value = true;
      try {
        const q = new URLSearchParams({ page: page.value - 1, size: size.value });
        if (query.value.warehouseId) q.set('warehouseId', query.value.warehouseId);
        if (query.value.status) q.set('status', query.value.status);
        const data = await ImsAuth.api('/stocktakes?' + q);
        list.value = data.items || [];
        total.value = data.total || 0;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally { loading.value = false; }
    }
    function search() {
      page.value = 1;
      load();
    }
    function resetQuery() {
      query.value = { warehouseId: null, status: null };
      page.value = 1;
      load();
    }
    async function doCreate() {
      try {
        const blocked = await ImsAuth.api('/stocktakes/precheck', { method:'POST', body: JSON.stringify({ warehouseId: form.value.warehouseId, scope: form.value.scope }) });
        if (blocked && blocked.length) {
          await ElementPlus.ElMessageBox.alert('存在阻塞单据: ' + blocked.join(', '), '无法创建');
          return;
        }
        const body = { warehouseId: form.value.warehouseId, scope: form.value.scope };
        if (form.value.scope !== 'ALL' && form.value.scopeText) body.scopeValue = form.value.scopeText.split(',').map(s => Number(s.trim()));
        await ImsAuth.api('/stocktakes', { method:'POST', body: JSON.stringify(body) });
        createDlg.value = false;
        ElementPlus.ElMessage.success('创建成功');
        search();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function doLock(row) {
      try {
        await ImsAuth.api(`/stocktakes/${row.id}/lock`, { method:'POST' });
        ElementPlus.ElMessage.success('已冻结快照');
        load();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function openCount(row) {
      try {
        currentStId.value = row.id;
        countPage.value = 1;
        countItems.value = await ImsAuth.api(`/stocktakes/${row.id}/items`);
        countItems.value.forEach(i => { if (i.countedQty == null) i.countedQty = i.snapshotQty; });
        countDlg.value = true;
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function saveCounts() {
      try {
        for (const item of countItems.value) {
          if (item.excluded === 1) continue;
          await ImsAuth.api(`/stocktakes/${currentStId.value}/items/${item.id}`, { method:'PUT', body: JSON.stringify({ countedQty: item.countedQty }) });
        }
        countDlg.value = false;
        ElementPlus.ElMessage.success('实盘已保存');
        load();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function importCsv(e) {
      const f = e.target.files[0]; if (!f) return;
      try {
        const text = await f.text();
        const rows = text.split(/\r?\n/).slice(1).filter(Boolean).map(line => {
          const [skuCode, locationId, countedQty, reason] = line.split(',');
          return { skuCode: skuCode.trim(), locationId: locationId?Number(locationId):0, countedQty: Number(countedQty), reason };
        });
        await ImsAuth.api(`/stocktakes/${currentStId.value}/items/import`, { method:'POST', body: JSON.stringify(rows) });
        countItems.value = await ImsAuth.api(`/stocktakes/${currentStId.value}/items`);
        countPage.value = 1;
        ElementPlus.ElMessage.success('导入成功');
      } catch (err) { ElementPlus.ElMessage.error(err.message); }
      finally { e.target.value = ''; }
    }
    async function doSubmit(row) {
      try {
        await ImsAuth.api(`/stocktakes/${row.id}/submit`, { method:'POST' });
        ElementPlus.ElMessage.success('已提交差异');
        load();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function doApprove(row) {
      try {
        await ImsAuth.api(`/stocktakes/${row.id}/approve`, { method:'POST', body: JSON.stringify({ version: row.version }) });
        ElementPlus.ElMessage.success('审批已生效');
        load();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function doReject(row) {
      try {
        const { value } = await ElementPlus.ElMessageBox.prompt('驳回原因', '复盘');
        await ImsAuth.api(`/stocktakes/${row.id}/reject`, { method:'POST', body: JSON.stringify({ version: row.version, reason: value }) });
        load();
      } catch (e) {
        if (e !== 'cancel') ElementPlus.ElMessage.error(e.message);
      }
    }
    async function doCancel(row) {
      try {
        await ImsAuth.api(`/stocktakes/${row.id}/cancel`, { method:'POST' });
        ElementPlus.ElMessage.success('已取消');
        load();
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    async function downloadReport(row) {
      try {
        await ImsAuth.download(`/stocktakes/${row.id}/report`, row.stocktakeNo + '.csv');
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
    }
    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      try {
        warehouses.value = (await ImsAuth.api('/warehouses?page=0&size=100')).items;
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
      load();
    });
    return {
      navHtml, tableHeight, list, loading, warehouses, total, page, size, query, statuses,
      createDlg, form, countDlg, countItems, pagedCountItems, countPage, countSize,
      statusLabel, statusTag, scopeLabel, warehouseName, formatTime, diffQty, diffClass,
      load, search, resetQuery, doCreate, doLock, openCount, saveCounts, importCsv,
      doSubmit, doApprove, doReject, doCancel, downloadReport
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
