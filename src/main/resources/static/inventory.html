<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存查询 - IMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</head>
<body class="bg-slate-50">
<div id="app" class="flex min-h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700"><h1 class="text-lg font-bold">IMS 库存管理</h1></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" v-html="navHtml"></nav>
    <div class="px-6 py-4 border-t border-slate-700 text-xs text-slate-400">{{ user?.realName }}</div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">实时库存</h2>
        <p class="text-sm text-slate-500 mt-0.5">按 SKU + 仓库查询在库、预留、可用与在途数量</p>
      </div>
      <el-button @click="ImsAuth.logout()">退出</el-button>
    </header>

    <div class="flex-1 p-8 min-w-0">
      <el-tabs v-model="tab">
        <el-tab-pane label="库存查询" name="inv">
          <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 shadow-sm">
            <div class="flex flex-wrap gap-3 items-end">
              <div class="w-48">
                <label class="block text-xs text-slate-500 mb-1">仓库</label>
                <el-select v-model="query.warehouseId" placeholder="全部仓库" clearable filterable class="w-full">
                  <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
                </el-select>
              </div>
              <div class="w-52">
                <label class="block text-xs text-slate-500 mb-1">分类</label>
                <el-select v-model="query.categoryId" placeholder="全部分类" clearable filterable class="w-full">
                  <el-option v-for="c in flatCats" :key="c.id" :label="c.name" :value="c.id" />
                </el-select>
              </div>
              <div class="flex-1 min-w-[200px]">
                <label class="block text-xs text-slate-500 mb-1">SKU / 条码</label>
                <el-input v-model="query.keyword" placeholder="编码或条码" clearable @keyup.enter="search" />
              </div>
              <el-checkbox v-model="query.lowStockOnly" class="mb-1">仅低库存</el-checkbox>
              <el-button type="primary" @click="search">查询</el-button>
              <el-button @click="resetQuery">重置</el-button>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <el-table
              :data="list"
              v-loading="loading"
              stripe
              style="width: 100%"
              :height="tableHeight"
              :row-class-name="invRowClass"
              empty-text="暂无库存数据"
            >
              <el-table-column prop="skuCode" label="SKU" min-width="140" show-overflow-tooltip>
                <template #default="{ row }">
                  <div class="font-medium">{{ row.skuCode || '-' }}</div>
                  <div v-if="row.barcode" class="text-xs text-slate-400">{{ row.barcode }}</div>
                </template>
              </el-table-column>
              <el-table-column prop="spuName" label="商品" min-width="140" show-overflow-tooltip>
                <template #default="{ row }">{{ row.spuName || '-' }}</template>
              </el-table-column>
              <el-table-column prop="warehouseName" label="仓库" min-width="120" show-overflow-tooltip>
                <template #default="{ row }">{{ row.warehouseName || '-' }}</template>
              </el-table-column>
              <el-table-column prop="locationCode" label="库位" width="100" align="center">
                <template #default="{ row }">{{ row.locationCode || '-' }}</template>
              </el-table-column>
              <el-table-column prop="onHandQty" label="在库" width="90" align="right">
                <template #default="{ row }">{{ formatQty(row.onHandQty) }}</template>
              </el-table-column>
              <el-table-column prop="reservedQty" label="预留" width="90" align="right">
                <template #default="{ row }">
                  <span :class="row.reservedQty > 0 ? 'text-amber-600 font-medium' : ''">{{ formatQty(row.reservedQty) }}</span>
                </template>
              </el-table-column>
              <el-table-column prop="availableQty" label="可用" width="90" align="right">
                <template #default="{ row }">
                  <span :class="availClass(row.availableQty)">{{ formatQty(row.availableQty) }}</span>
                </template>
              </el-table-column>
              <el-table-column prop="inTransitQty" label="在途" width="90" align="right">
                <template #default="{ row }">
                  <span :class="row.inTransitQty > 0 ? 'text-blue-600 font-medium' : ''">{{ formatQty(row.inTransitQty) }}</span>
                </template>
              </el-table-column>
              <el-table-column label="锁定" width="88" align="center">
                <template #default="{ row }">
                  <el-tag v-if="row.locked" type="warning" size="small">锁定</el-tag>
                  <span v-else class="text-slate-400">-</span>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="150" fixed="right" align="center">
                <template #default="{ row }">
                  <el-button link type="primary" @click="showSku(row)">分布</el-button>
                  <el-button link type="warning" v-if="row.locked && canUnlock" @click="unlock(row)">解锁</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div class="px-4 py-3 border-t border-slate-100 flex justify-end">
              <el-pagination
                v-model:current-page="page"
                v-model:page-size="size"
                :total="total"
                :page-sizes="[10, 20, 50, 100]"
                background
                layout="total, sizes, prev, pager, next, jumper"
                @current-change="load"
                @size-change="search"
              />
            </div>
          </div>
        </el-tab-pane>

        <el-tab-pane label="变动日志" name="logs">
          <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 shadow-sm">
            <div class="flex flex-wrap gap-3 items-end">
              <div class="w-44">
                <label class="block text-xs text-slate-500 mb-1">仓库</label>
                <el-select v-model="logQuery.warehouseId" placeholder="全部仓库" clearable filterable class="w-full">
                  <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
                </el-select>
              </div>
              <div class="w-48">
                <label class="block text-xs text-slate-500 mb-1">单据号</label>
                <el-input v-model="logQuery.movementNo" placeholder="单据号" clearable @keyup.enter="searchLogs" />
              </div>
              <div class="w-40">
                <label class="block text-xs text-slate-500 mb-1">类型</label>
                <el-select v-model="logQuery.changeType" placeholder="全部类型" clearable class="w-full">
                  <el-option v-for="t in changeTypes" :key="t.value" :label="t.label" :value="t.value" />
                </el-select>
              </div>
              <el-button type="primary" @click="searchLogs">查询</el-button>
              <el-button @click="resetLogQuery">重置</el-button>
              <el-button @click="exportLogs">导出 CSV</el-button>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <el-table
              :data="logs"
              v-loading="logLoading"
              stripe
              style="width: 100%"
              :height="tableHeight"
              empty-text="暂无变动日志"
            >
              <el-table-column label="时间" min-width="170">
                <template #default="{ row }">{{ formatTime(row.operatedAt) }}</template>
              </el-table-column>
              <el-table-column prop="skuCode" label="SKU" min-width="130" show-overflow-tooltip />
              <el-table-column prop="warehouseName" label="仓库" min-width="110" show-overflow-tooltip>
                <template #default="{ row }">{{ row.warehouseName || '-' }}</template>
              </el-table-column>
              <el-table-column label="类型" width="110" align="center">
                <template #default="{ row }">
                  <el-tag :type="changeTagType(row.changeType)" size="small">{{ changeLabel(row.changeType) }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="变动" width="80" align="right">
                <template #default="{ row }">
                  <span :class="row.deltaQty > 0 ? 'text-emerald-600' : (row.deltaQty < 0 ? 'text-red-600' : '')">
                    {{ row.deltaQty > 0 ? '+' : '' }}{{ row.deltaQty }}
                  </span>
                </template>
              </el-table-column>
              <el-table-column label="在库" width="130" align="center">
                <template #default="{ row }">{{ row.onHandBefore }} → {{ row.onHandAfter }}</template>
              </el-table-column>
              <el-table-column label="可用" width="130" align="center">
                <template #default="{ row }">{{ row.availableBefore }} → {{ row.availableAfter }}</template>
              </el-table-column>
              <el-table-column prop="movementNo" label="单据号" min-width="180" show-overflow-tooltip>
                <template #default="{ row }">
                  <a v-if="row.movementId" :href="'movements.html?id=' + row.movementId" class="text-blue-600">{{ row.movementNo || row.movementId }}</a>
                  <span v-else class="text-slate-400">-</span>
                </template>
              </el-table-column>
              <el-table-column prop="remark" label="备注" min-width="140" show-overflow-tooltip>
                <template #default="{ row }">{{ row.remark || '-' }}</template>
              </el-table-column>
            </el-table>
            <div class="px-4 py-3 border-t border-slate-100 flex justify-end">
              <el-pagination
                v-model:current-page="logPage"
                v-model:page-size="logSize"
                :total="logTotal"
                :page-sizes="[10, 20, 50, 100]"
                background
                layout="total, sizes, prev, pager, next, jumper"
                @current-change="loadLogs"
                @size-change="searchLogs"
              />
            </div>
          </div>
        </el-tab-pane>
      </el-tabs>
    </div>

    <el-drawer v-model="skuDrawer" title="SKU 库存分布" size="560px">
      <div v-if="skuDist.length" class="mb-3 text-sm text-slate-500">
        {{ skuDist[0].skuCode }}<span v-if="skuDist[0].spuName"> · {{ skuDist[0].spuName }}</span>
      </div>
      <el-table :data="skuDist" border size="small" style="width: 100%" empty-text="暂无分布数据">
        <el-table-column prop="warehouseName" label="仓库" min-width="120" />
        <el-table-column prop="locationCode" label="库位" width="90" align="center" />
        <el-table-column prop="onHandQty" label="在库" width="70" align="right" />
        <el-table-column prop="reservedQty" label="预留" width="70" align="right" />
        <el-table-column prop="availableQty" label="可用" width="70" align="right" />
        <el-table-column prop="inTransitQty" label="在途" width="70" align="right" />
      </el-table>
    </el-drawer>
  </main>
</div>
<style>
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:#cbd5e1}
.nav-link.active{background:#2563eb;color:#fff}
.el-table table{width:100% !important;border-collapse:separate !important}
.el-table th.el-table__cell,.el-table td.el-table__cell{display:table-cell !important}
.el-table .row-low td{background:#fef2f2 !important}
.el-table .row-locked td{background:#fff7ed !important}
.el-pagination{flex-wrap:wrap}
</style>
<script>
const { createApp, ref, computed, onMounted } = Vue;
const CHANGE_TYPES = [
  { value: 'IN', label: '入库' },
  { value: 'OUT', label: '出库' },
  { value: 'RESERVE', label: '预留' },
  { value: 'RELEASE', label: '释放' },
  { value: 'TRANSFER_OUT', label: '调出' },
  { value: 'TRANSFER_IN', label: '调入' },
  { value: 'ADJUST_GAIN', label: '盘盈' },
  { value: 'ADJUST_LOSS', label: '盘亏' },
  { value: 'RETURN_IN', label: '退货入' },
  { value: 'RETURN_OUT', label: '退货出' }
];
const CHANGE_TAG = {
  IN: 'success', OUT: 'danger', RESERVE: 'warning', RELEASE: 'info',
  TRANSFER_OUT: 'warning', TRANSFER_IN: '', ADJUST_GAIN: 'success', ADJUST_LOSS: 'danger',
  RETURN_IN: 'success', RETURN_OUT: 'danger'
};

createApp({
  setup() {
    const navHtml = computed(() => ImsNav.render('inventory.html'));
    const user = ref(null);
    const tab = ref('inv');
    const canUnlock = computed(() => ImsAuth.hasPermission('inventory:unlock'));
    const tableHeight = computed(() => Math.max(360, window.innerHeight - 380));

    const list = ref([]), warehouses = ref([]), categories = ref([]);
    const loading = ref(false), total = ref(0), page = ref(1), size = ref(20);
    const query = ref({ warehouseId: null, categoryId: null, keyword: '', lowStockOnly: false });

    const logs = ref([]), logLoading = ref(false), logTotal = ref(0), logPage = ref(1), logSize = ref(20);
    const logQuery = ref({ warehouseId: null, movementNo: '', changeType: null });
    const changeTypes = CHANGE_TYPES;
    const skuDrawer = ref(false), skuDist = ref([]);

    const flatCats = computed(() => {
      const out = [];
      function walk(nodes, prefix) {
        (nodes || []).forEach(n => {
          out.push({ id: n.id, name: prefix + n.name });
          walk(n.children, prefix + n.name + ' / ');
        });
      }
      walk(categories.value, '');
      return out;
    });

    function formatQty(n) {
      return n == null ? '-' : n;
    }
    function availClass(n) {
      if (n == null) return '';
      if (n <= 0) return 'text-red-600 font-medium';
      if (n <= 10) return 'text-amber-600 font-medium';
      return 'text-emerald-600 font-medium';
    }
    function invRowClass({ row }) {
      if (row.locked) return 'row-locked';
      if (row.availableQty != null && row.availableQty <= 10) return 'row-low';
      return '';
    }
    function formatTime(v) {
      return ImsTime.format(v);
    }
    function changeLabel(type) {
      const hit = CHANGE_TYPES.find(t => t.value === type);
      return hit ? hit.label : type;
    }
    function changeTagType(type) {
      return CHANGE_TAG[type] || 'info';
    }

    async function load() {
      loading.value = true;
      try {
        const q = new URLSearchParams({ page: page.value - 1, size: size.value });
        if (query.value.warehouseId) q.set('warehouseId', query.value.warehouseId);
        if (query.value.categoryId) q.set('categoryId', query.value.categoryId);
        if (query.value.keyword) q.set('keyword', query.value.keyword);
        if (query.value.lowStockOnly) q.set('lowStockOnly', 'true');
        const data = await ImsAuth.api('/inventory?' + q);
        list.value = data.items || [];
        total.value = data.total || 0;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        loading.value = false;
      }
    }
    function search() {
      page.value = 1;
      load();
    }
    function resetQuery() {
      query.value = { warehouseId: null, categoryId: null, keyword: '', lowStockOnly: false };
      page.value = 1;
      load();
    }
    async function loadLogs() {
      logLoading.value = true;
      try {
        const q = new URLSearchParams({ page: logPage.value - 1, size: logSize.value });
        if (logQuery.value.warehouseId) q.set('warehouseId', logQuery.value.warehouseId);
        if (logQuery.value.movementNo) q.set('movementNo', logQuery.value.movementNo);
        if (logQuery.value.changeType) q.set('changeType', logQuery.value.changeType);
        const data = await ImsAuth.api('/inventory/logs?' + q);
        logs.value = data.items || [];
        logTotal.value = data.total || 0;
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        logLoading.value = false;
      }
    }
    function searchLogs() {
      logPage.value = 1;
      loadLogs();
    }
    function resetLogQuery() {
      logQuery.value = { warehouseId: null, movementNo: '', changeType: null };
      logPage.value = 1;
      loadLogs();
    }
    async function exportLogs() {
      const q = new URLSearchParams();
      if (logQuery.value.warehouseId) q.set('warehouseId', logQuery.value.warehouseId);
      if (logQuery.value.movementNo) q.set('movementNo', logQuery.value.movementNo);
      if (logQuery.value.changeType) q.set('changeType', logQuery.value.changeType);
      await ImsAuth.download('/inventory/logs/export?' + q, 'inventory-logs.csv');
    }
    async function showSku(row) {
      skuDist.value = await ImsAuth.api('/inventory/sku/' + row.skuId);
      skuDrawer.value = true;
    }
    async function unlock(row) {
      await ElementPlus.ElMessageBox.confirm('确认临时解锁并从本次盘点排除该 SKU？');
      await ImsAuth.api('/inventory/' + row.id + '/unlock', { method: 'POST' });
      ElementPlus.ElMessage.success('已解锁');
      load();
    }

    onMounted(async () => {
      if (!ImsAuth.requireAuth()) return;
      user.value = ImsAuth.getUser();
      const [wh, cats] = await Promise.all([
        ImsAuth.api('/warehouses?page=0&size=100'),
        ImsAuth.api('/categories')
      ]);
      warehouses.value = wh.items || [];
      categories.value = cats || [];
      load();
      loadLogs();
    });

    return {
      navHtml, user, tab, canUnlock, tableHeight, ImsAuth,
      list, warehouses, loading, total, page, size, query, flatCats,
      logs, logLoading, logTotal, logPage, logSize, logQuery, changeTypes,
      skuDrawer, skuDist,
      load, search, resetQuery,
      loadLogs, searchLogs, resetLogQuery, exportLogs,
      showSku, unlock,
      formatQty, availClass, invRowClass, formatTime, changeLabel, changeTagType
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
